<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>J-DATA Report Web</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:#f3f6fb;color:#1b2a3a}
header{background:#0d3b6e;color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:17px;margin:0;flex:1}select,input,button{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid #b8c4d6}
button{background:#1565c0;color:#fff;border:0;cursor:pointer}button.sec{background:#e3ebf6;color:#0d3b6e}button:disabled{opacity:.5}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid #dbe3ee;position:sticky;top:50px;z-index:15}
nav button{background:#e3ebf6;color:#0d3b6e;white-space:nowrap}nav button.on{background:#1565c0;color:#fff}
main{padding:16px;max-width:1400px;margin:auto}.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px #0001}
.mut{color:#64748b;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
table{border-collapse:collapse;width:100%}th{background:#1565c0;color:#fff;text-align:left;padding:7px 8px;cursor:pointer;white-space:nowrap;position:sticky;top:0}
td{padding:6px 8px;border-bottom:1px solid #edf1f7;vertical-align:top}tr:nth-child(even) td{background:#f6f8fc}tr.click{cursor:pointer}tr.click:hover td{background:#e6f0ff}
.r{text-align:right;white-space:nowrap}.red{color:#c62828}.grn{color:#2e7d32}.wrap{overflow:auto;max-height:70vh;border-radius:8px}
#menu{position:fixed;background:#fff;border:1px solid #9fb3cf;border-radius:10px;padding:10px;z-index:100;box-shadow:0 6px 24px #0004;width:260px;max-height:70vh;overflow:auto}
#modal{position:fixed;inset:0;background:#0006;z-index:50;display:none;overflow:auto}#modal>div{background:#f3f6fb;margin:20px auto;max-width:1300px;border-radius:14px;padding:16px;min-height:60vh}
.grp{border-bottom:1px solid #e1e8f2;padding:8px 0}.grp label{display:block;padding:2px 0}.tag{background:#fff3cd;border-radius:6px;padding:0 6px;font-size:11px}
</style></head><body>
<header><h1>J-DATA Report Web</h1><select id="prof"></select><button id="reload" class="sec">Muat ulang</button><button id="cfg" class="sec">Pengaturan</button></header>
<nav id="nav"></nav><main id="main"><div class="card">Memuat…</div></main><div id="modal"><div id="mbody"></div></div><div id="menu" style="display:none"></div>
<script>
const $=id=>document.getElementById(id);
const nf=new Intl.NumberFormat('id-ID',{maximumFractionDigits:0});const PCS=24;
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const DAYS=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const canon=s=>(s||'').trim().toUpperCase().replace(/\s+/g,' ');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let CFG=JSON.parse(localStorage.getItem('jdr_cfg')||'{}');if(!CFG.url)CFG.url=location.hostname.includes('jdata-sync')?location.origin:'https://jdata-sync.muchlis7771.workers.dev';
let D={rows:[],ro:[],targets:[],stock:[]},tab='gap',profile='';
async function api(method,path,body){
  const r=await fetch(CFG.url+path,{method,headers:{'authorization':'Bearer '+(CFG.token||''),'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j;}
function settings(){const u=prompt('URL Worker jdata-sync:',CFG.url);if(u===null)return;const t=prompt('Token sinkron (sama dengan di aplikasi):',CFG.token||'');if(t===null)return;
  CFG={url:u.trim().replace(/\/$/,''),token:t.trim()};localStorage.setItem('jdr_cfg',JSON.stringify(CFG));init();}
$('cfg').onclick=settings;$('reload').onclick=()=>loadData();
async function init(){
  if(!CFG.token){$('main').innerHTML='<div class="card">Isi URL & token dulu di tombol <b>Pengaturan</b> (token sama dengan yang dipakai aplikasi Android di menu Sinkron Cloud).</div>';return;}
  try{const r=await api('GET','/sync/profiles');const ps=(r.profiles||[]).sort();$('prof').innerHTML=ps.map(p=>`<option>${esc(p)}</option>`).join('');
    profile=localStorage.getItem('jdr_prof')||ps[0]||'';if(ps.includes(profile))$('prof').value=profile;else profile=ps[0]||'';
    if(!profile){$('main').innerHTML='<div class="card">Belum ada data di cloud. Sinkron dari aplikasi dulu.</div>';return;}await loadData();}
  catch(e){$('main').innerHTML='<div class="card red">Gagal terhubung: '+esc(e.message)+'. Cek token/URL di Pengaturan.</div>';}}
$('prof').onchange=e=>{profile=e.target.value;localStorage.setItem('jdr_prof',profile);loadData();};
async function loadData(){
  $('main').innerHTML='<div class="card">Memuat data cloud… <span id="pg" class="mut"></span></div>';
  const k=encodeURIComponent(profile);const d=new Date();d.setMonth(d.getMonth()-6);const from=d.toISOString().slice(0,10);
  let rows=[],after=0;
  for(;;){const r=await api('GET',`/sync/history?profile=${k}&from=${from}&after=${after}`);
    for(const x of r.rows)rows.push({d:x.tanggal,ok:x.outlet_key,oid:x.outlet_id,on:x.outlet_name,s:x.salesman||'',sc:x.sku_code||'',sn:x.sku_name||'',om:+x.omset||0,q:+x.qty_karton||0,ordered:x.ordered==1});
    $('pg')&&($('pg').textContent=rows.length+' baris');if(r.next==null)break;after=r.next;}
  const ro=(await api('GET','/sync/ro?profile='+k)).outlets||[];
  const tg=(await api('GET','/sync/targets?profile='+k)).targets||[];
  let st=[];try{st=(await api('GET','/sync/stock?profile='+k)).items||[];}catch(e){}
  D={rows,ro:ro.map(o=>({key:o.outlet_key,id:o.outlet_id,name:o.outlet_name,s:o.salesman||'',extra:safeJ(o.extra)})),targets:tg,stock:st};
  prep();render();}
function safeJ(s){try{return JSON.parse(s||'{}')}catch(e){return{}}}
let X={};
function prep(){
  const latest=D.rows.reduce((m,r)=>r.d>m?r.d:m,'');X.latest=latest;
  const ym=latest.slice(0,7);const [y,m]=ym.split('-').map(Number);
  X.months=[2,1,0].map(i=>{let mm=m-i,yy=y;while(mm<1){mm+=12;yy--}return yy+'-'+String(mm).padStart(2,'0');});
  X.cur=X.months[2];X.mlab=X.months.map(s=>MON[+s.slice(5)-1]);
  const norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
  X.roByKey=new Map(D.ro.map(o=>[o.key,o]));X.roByName=new Map(D.ro.map(o=>[norm(o.name),o]));
  for(const r of D.rows){const o=X.roByKey.get(r.ok)||X.roByName.get(norm(r.on));r.ro=o?o.key:null;r.m=r.d.slice(0,7);}
}
function wk(o){const e=o.extra||{};return e['Hari Kunjungan']||e['hari']||e['Hari']||e.visitDay||e['__hari']||'';}
const tabs=[['gap','Target vs Actual'],['ro','Outlet RO'],['belum','RO Belum Beli'],['sales','Nama Salesman'],['sku','Nama SKU']];
function render(){
  $('nav').innerHTML=tabs.map(([k,t])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render()">${t}</button>`).join('');
  ({gap:vGap,ro:vRo,belum:vBelum,sales:vSales,sku:vSku})[tab]();}
/* ---------- tabel dengan filter ala Excel ---------- */
function ft(el,head,rows,o={}){
  const st={sort:-1,asc:true,ex:{},tx:{}};const left=new Set(o.left||[]);
  function view(){let l=rows.map((r,i)=>[i,r]).filter(([i,r])=>Object.entries(st.tx).every(([c,v])=>!v||String(r[c]).toLowerCase().includes(v.toLowerCase()))&&Object.entries(st.ex).every(([c,s])=>!s.has(String(r[c]))));
    if(st.sort>=0){const c=st.sort,n=s=>{const x=parseFloat(String(s).replace(/\./g,'').replace(',','.'));return isNaN(x)?null:x};
      l.sort((a,b)=>{const x=n(a[1][c]),y=n(b[1][c]);return x!=null&&y!=null?x-y:String(a[1][c]).localeCompare(String(b[1][c]))});if(!st.asc)l.reverse();}
    if(head[0]==='No')l=l.map(([i,r],n)=>[i,[n+1,...r.slice(1)]]);return l;}
  function draw(){const l=view();const act=st.sort>=0||Object.values(st.ex).some(s=>s.size)||Object.values(st.tx).some(v=>v);
    el.innerHTML=`<div class="mut">${l.length} dari ${rows.length} baris${act?' (filter aktif)':''} - klik judul kolom untuk filter</div><div class="wrap"><table><tr>${head.map((h,i)=>`<th data-c="${i}">${esc(h)} ${st.ex[i]?.size||st.tx[i]?'●':'▾'}</th>`).join('')}</tr>${l.slice(0,500).map(([i,r])=>`<tr class="${o.onRow?'click':''}" data-i="${i}">${r.map((v,c)=>`<td class="${left.has(head[c])?'':'r'} ${v==='Belum TRX'?'red':''}">${esc(v)}</td>`).join('')}</tr>`).join('')}</table></div>${l.length>500?'<div class="mut">Menampilkan 500 baris pertama; persempit dengan filter.</div>':''}<div class="row"><button class="sec" data-csv>Download CSV</button></div>`;
    el.querySelectorAll('th').forEach(th=>th.onclick=e=>{e.stopPropagation();menu(th,+th.dataset.c)});
    if(o.onRow)el.querySelectorAll('tr.click').forEach(tr=>tr.onclick=()=>o.onRow(+tr.dataset.i));
    el.querySelector('[data-csv]').onclick=()=>{const csv=[head,...view().map(x=>x[1])].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download=(o.title||'tabel')+'.csv';a.click();};}
  function menu(th,c){const m=$('menu');const vals=[...new Set(rows.map(r=>String(r[c])))];const exs=st.ex[c]||new Set();const chk=vals.length>=2&&vals.length<=40;
    m.innerHTML=`<div class="row"><button class="sec" id="ma">Urut A→Z / kecil→besar</button><button class="sec" id="md">Urut Z→A / besar→kecil</button></div>`+
      (chk?vals.sort().map(v=>`<label><input type="checkbox" data-v="${esc(v)}" ${exs.has(v)?'':'checked'}> ${esc(v)||'(kosong)'}</label>`).join(''):`<input id="mt" placeholder="Cari teks…" value="${esc(st.tx[c]||'')}" style="width:100%">`)+
      `<div class="row"><button id="mo">OK</button><button class="sec" id="mr">Reset</button></div>`;
    const b=th.getBoundingClientRect();m.style.display='block';m.style.left=Math.min(b.left,innerWidth-280)+'px';m.style.top=Math.min(b.bottom,innerHeight-200)+'px';
    $('ma').onclick=()=>{st.sort=c;st.asc=true;m.style.display='none';draw()};$('md').onclick=()=>{st.sort=c;st.asc=false;m.style.display='none';draw()};
    $('mr').onclick=()=>{delete st.ex[c];delete st.tx[c];if(st.sort===c)st.sort=-1;m.style.display='none';draw()};
    $('mo').onclick=()=>{if(chk){const s=new Set();m.querySelectorAll('input[data-v]').forEach(i=>{if(!i.checked)s.add(i.dataset.v)});st.ex[c]=s;}else st.tx[c]=$('mt').value;m.style.display='none';draw()};}
  draw();}
document.addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('th'))$('menu').style.display='none'});
const closeM=()=>{$('modal').style.display='none'};
function modal(html){$('mbody').innerHTML=`<div class="row"><button class="sec" onclick="closeM()">← Kembali</button></div>`+html;$('modal').style.display='block';}
/* ---------- Target vs Actual ---------- */
function vGap(){
  const months=[...new Set(D.rows.map(r=>r.m))].sort().reverse();
  const sel=X.gm||months[0];X.gm=sel;
  const by=new Map();
  for(const r of D.rows){if(r.m!==sel)continue;const k=canon(r.s)||'(TANPA SALESMAN)';let e=by.get(k);if(!e)by.set(k,e={n:r.s||'(tanpa salesman)',om:0,ao:new Set()});e.om+=r.om;if(r.om!==0)e.ao.add(r.ok)}
  const tg=new Map(D.targets.map(t=>[canon(t.salesman),t]));const roC=new Map();for(const o of D.ro)roC.set(canon(o.s),(roC.get(canon(o.s))||0)+1);
  const names=new Set([...by.keys(),...tg.keys()]);
  const rows=[...names].map(k=>{const e=by.get(k)||{n:tg.get(k)?.salesman||k,om:0,ao:new Set()};const t=tg.get(k);const T=t?+t.omset:0;
    return [e.n,t?nf.format(T):'-',nf.format(e.om),T?Math.round(e.om/T*100)+'%':'-',T?nf.format(e.om-T):'-',t?nf.format(+t.ao):'-',e.ao.size,roC.get(k)||0];}).sort((a,b)=>a[0].localeCompare(b[0]));
  $('main').innerHTML=`<div class="card"><div class="row"><b>Target vs Actual</b><select id="gm">${months.map(m=>`<option ${m===sel?'selected':''}>${m}</option>`).join('')}</select></div><div id="t"></div><div class="mut">Data s/d ${X.latest}. Nama ganda (mis. HUSAIN / HUSEIN) bisa digabung di tab Nama Salesman.</div></div>`;
  $('gm').onchange=e=>{X.gm=e.target.value;vGap()};
  ft($('t'),['Salesman','Target Omset','Actual','%','Gap','Target AO','AO','RO'],rows,{left:['Salesman'],title:'target-vs-actual'});}
/* ---------- Outlet RO + potensi order ---------- */
function vRo(){
  const sold=new Set(D.rows.filter(r=>r.m===X.cur&&r.om!==0&&r.ro).map(r=>r.ro));
  const list=D.ro.filter(o=>o.extra.__baru!=='1');
  const rows=list.map(o=>[o.s||'-',o.id||o.key,o.name,wk(o)||'-',sold.has(o.key)?'Sudah TRX':'Belum TRX']);
  $('main').innerHTML=`<div class="card"><b>Outlet RO - bulan ${X.cur}</b><div class="mut">Klik outlet untuk melihat SKU potensi order.</div><div id="t"></div></div>`;
  ft($('t'),['Salesman','Kode','Nama Outlet','Hari','Status'],rows,{left:['Salesman','Kode','Nama Outlet','Hari','Status'],title:'outlet-ro',onRow:i=>ideas(list[i])});}
function agg(rows){ // net per (sku,bulan,outlet)
  const m=new Map();for(const r of rows){const sk=r.sc||r.sn.toLowerCase();const k=sk+'|'+r.m;let e=m.get(k);if(!e)m.set(k,e={q:0,o:0,n:r.sn||r.sc,c:r.sc,last:''});e.q+=r.q;e.o+=r.om;if((r.om!==0||r.q!==0)&&r.d>e.last)e.last=r.d;}return m;}
function ideas(o){
  const hist=D.rows.filter(r=>r.ro===o.key);const mi=X.months;
  const fastMap=new Map();for(const r of D.rows){if(!mi.includes(r.m))continue;const sk=r.sc||r.sn.toLowerCase();let e=fastMap.get(sk);if(!e)fastMap.set(sk,e={n:r.sn||r.sc,c:r.sc,q:0,per:new Map()});e.q+=r.q;
    const pk=r.ok+'|'+r.m;e.per.set(pk,(e.per.get(pk)||0)+r.q);}
  const fast=[...fastMap.entries()].sort((a,b)=>b[1].q-a[1].q).slice(0,20).map(x=>x[0]);
  const own=new Map();for(const r of hist){const sk=r.sc||r.sn.toLowerCase();let e=own.get(sk);if(!e)own.set(sk,e={n:r.sn||r.sc,c:r.sc,q:{},o:{},last:''});
    e.q[r.m]=(e.q[r.m]||0)+r.q;e.o[r.m]=(e.o[r.m]||0)+r.om;if((r.om!==0||r.q!==0)&&r.d>e.last)e.last=r.d;}
  const today=new Date(X.latest);const gap=d=>d?Math.floor((today-new Date(d))/864e5):-1;
  const keys=[...fast];for(const [k,e] of own){if(!keys.includes(k)&&e.last&&gap(e.last)>=60)keys.push(k);}
  const stockOf=(c,n)=>{const f=D.stock.find(s=>(c&&s.c===c)||(s.n||'').toLowerCase()===(n||'').toLowerCase());return f?+f.q:null;};
  const rows=keys.map((k,i)=>{const e=own.get(k),fm=fastMap.get(k);const name=e?.n||fm?.n,code=e?.c||fm?.c;
    const q=mi.map(m=>Math.max(0,(e?.q[m]||0))*PCS),om=mi.map(m=>Math.max(0,e?.o[m]||0));const q3=q.reduce((a,b)=>a+b,0),o3=om.reduce((a,b)=>a+b,0);
    const last=e?.last||'';const ket=last&&gap(last)<60?'Sudah TRX':'Belum TRX';const st=stockOf(code,name);
    return [i+1,name,ket,...q.map(x=>nf.format(Math.round(x))),nf.format(Math.round(q3)),nf.format(Math.round(q3/3)),...om.map(x=>nf.format(Math.round(x))),nf.format(Math.round(o3)),nf.format(Math.round(o3/3)),last||'-',st==null?'-':nf.format(st)];});
  const head=['No','SKU','Ket',...X.mlab.map(m=>'Qty '+m),'Qty 3 bln','AVG Qty L3M',...X.mlab.map(m=>'Omset '+m),'Omset 3 bln','AVG Omset L3M','Terakhir','Stok'];
  modal(`<div class="card"><h3 style="margin:0">${esc(o.name)}</h3><div class="mut">${esc(o.id||o.key)} - ${esc(o.s)} - ${esc(wk(o))} | data s/d ${X.latest}</div><div class="mut">20 SKU terlaris 3 bulan terakhir (semua outlet) + SKU outlet ini yang sudah ≥2 bulan tidak transaksi. Qty dalam pcs (1 karton = 24 pcs). Sudah TRX = beli dalam 2 bulan terakhir.</div><div id="t2"></div></div>`);
  ft($('t2'),head,rows,{left:['No','SKU','Ket','Terakhir','Stok'],title:'potensi-'+o.name});}
/* ---------- RO belum beli ---------- */
function vBelum(){
  const sm=[...new Set(D.ro.map(o=>o.s).filter(Boolean))].sort();const skuMap=new Map();
  for(const r of D.rows){if(!X.months.includes(r.m))continue;const k=r.sc||r.sn.toLowerCase();let e=skuMap.get(k);if(!e)skuMap.set(k,e={k,n:r.sn||r.sc,q:0});e.q+=r.q;}
  const skus=[...skuMap.values()].sort((a,b)=>b.q-a.q);
  X.bs=X.bs||sm[0]||'';X.bk=X.bk||skus[0]?.k||'';
  $('main').innerHTML=`<div class="card"><div class="row"><b>RO belum beli di bulan ${X.cur}</b><select id="bs">${sm.map(s=>`<option ${s===X.bs?'selected':''}>${esc(s)}</option>`).join('')}</select><select id="bk">${skus.map(s=>`<option value="${esc(s.k)}" ${s.k===X.bk?'selected':''}>${esc(s.n)}</option>`).join('')}</select></div><div id="t"></div></div>`;
  $('bs').onchange=e=>{X.bs=e.target.value;vBelum()};$('bk').onchange=e=>{X.bk=e.target.value;vBelum()};
  const outs=D.ro.filter(o=>canon(o.s)===canon(X.bs)&&o.extra.__baru!=='1');const per=new Map();
  for(const r of D.rows){if(!r.ro||(r.sc||r.sn.toLowerCase())!==X.bk)continue;let e=per.get(r.ro);if(!e)per.set(r.ro,e={q:{},last:''});e.q[r.m]=(e.q[r.m]||0)+r.q;if((r.om!==0||r.q!==0)&&r.d>e.last)e.last=r.d;}
  const rows=outs.map(o=>{const e=per.get(o.key)||{q:{},last:''};const q=X.months.map(m=>Math.max(0,e.q[m]||0)*PCS);return{o,q,last:e.last};})
    .filter(x=>x.q[2]<=0).sort((a,b)=>b.q.reduce((s,v)=>s+v,0)-a.q.reduce((s,v)=>s+v,0))
    .map(x=>[x.o.id||x.o.key,x.o.name,wk(x.o)||'-',...x.q.map(v=>nf.format(Math.round(v))),nf.format(Math.round(x.q.reduce((s,v)=>s+v,0))),x.last||'-']);
  ft($('t'),['Kode','Nama Outlet','Hari',...X.mlab.map(m=>'Qty '+m+' (pcs)'),'Qty 3 bln','Terakhir beli'],rows,{left:['Kode','Nama Outlet','Hari','Terakhir beli'],title:'ro-belum-beli'});
  $('t').insertAdjacentHTML('beforebegin',`<div class="mut">${rows.length} dari ${outs.length} outlet RO ${esc(X.bs)} belum membeli SKU ini di bulan ${X.cur}.</div>`);}
/* ---------- gabung nama (salesman & SKU) ---------- */
const lev=(a,b)=>{const d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]};
function groupBy(items,sim,order){const p=items.map((_,i)=>i);const f=x=>{while(p[x]!==x){p[x]=p[p[x]];x=p[x]}return x};
  for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++)if(sim(items[i],items[j]))p[f(i)]=f(j);
  const g=new Map();items.forEach((it,i)=>{const r=f(i);(g.get(r)||g.set(r,[]).get(r)).push(it)});return[...g.values()].filter(a=>a.length>1).map(a=>a.sort(order));}
function salStats(){const m=new Map();for(const r of D.rows){const k=canon(r.s);if(!k)continue;let e=m.get(k);if(!e)m.set(k,e={name:r.s.trim(),rows:0,om:0,ro:0});e.rows++;e.om+=r.om;}
  for(const o of D.ro){const k=canon(o.s);if(!k)continue;let e=m.get(k);if(!e)m.set(k,e={name:o.s.trim(),rows:0,om:0,ro:0});e.ro++;}
  for(const t of D.targets){const k=canon(t.salesman);if(k&&!m.has(k))m.set(k,{name:t.salesman.trim(),rows:0,om:0,ro:0});}return[...m.values()].sort((a,b)=>b.om-a.om);}
function salSim(a,b){const ta=canon(a.name).split(' '),tb=canon(b.name).split(' ');if(ta[0]===tb[0])return true;const A=canon(a.name),B=canon(b.name);
  if(A.startsWith(B)||B.startsWith(A))return true;return ta[0].length>=4&&tb[0].length>=4&&lev(ta[0],tb[0])<=1;}
function vSales(){const st=salStats();const gr=groupBy(st,salSim,(a,b)=>b.om-a.om);
  $('main').innerHTML=`<div class="card"><b>Kemungkinan nama salesman ganda (${gr.length})</b><div class="mut">Pilih nama final, lalu Gabungkan. Mengubah riwayat penjualan, RO, dan target langsung di cloud. Di aplikasi Android, lakukan Sinkron Cloud (pulihkan) agar HP ikut.</div>
  ${gr.map((g,gi)=>`<div class="grp">${g.map((n,i)=>`<label><input type="radio" name="g${gi}" value="${i}" ${i===0?'checked':''}> <b>${esc(n.name)}</b> <span class="mut">${nf.format(n.rows)} baris - Rp ${nf.format(n.om)} - ${n.ro} RO</span></label>`).join('')}<button onclick="mergeSal(${gi})">Gabungkan</button></div>`).join('')||'<div class="mut">Tidak ada nama mirip.</div>'}</div>
  <div class="card"><b>Pilih manual</b><div class="mut">Centang 2+ nama.</div>${st.map((n,i)=>`<label style="display:block"><input type="checkbox" class="ms" value="${i}"> ${esc(n.name)} <span class="mut">Rp ${nf.format(n.om)} - ${n.ro} RO</span></label>`).join('')}<div class="row"><input id="mname" placeholder="Nama final"><button onclick="mergeSalManual()">Gabungkan yang dicentang</button></div></div>`;
  X.sg=gr;X.sst=st;}
async function doSal(froms,to){if(!froms.length||!to)return;if(!confirm('Gabungkan '+froms.join(', ')+' menjadi '+to+'? Berlaku di cloud.'))return;
  try{await api('POST','/sync/rename',{profile,kind:'salesman',to,froms});alert('Selesai.');await loadData();}catch(e){alert('Gagal: '+e.message+' (pastikan Worker jdata-sync sudah di-deploy versi terbaru)')}}
function mergeSal(gi){const g=X.sg[gi];const sel=+document.querySelector(`input[name=g${gi}]:checked`).value;doSal(g.filter((_,i)=>i!==sel).map(n=>n.name),g[sel].name);}
function mergeSalManual(){const ch=[...document.querySelectorAll('.ms:checked')].map(i=>X.sst[+i.value]);const to=$('mname').value.trim()||ch[0]?.name;if(ch.length<2)return alert('Pilih minimal 2 nama.');doSal(ch.filter(n=>canon(n.name)!==canon(to)).map(n=>n.name),to);}
function skuToks(n){let s=(n||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();s=s.replace(/(\d+)\s+(ml|gr|g|l|kg|pcs|pc|cc)\b/g,'$1$2').replace(/(\d+)gr\b/g,'$1g').replace(/(\d+)pc\b/g,'$1pcs');return s.split(' ').filter(Boolean)}
function skuSim(a,b){if(a.code&&a.code.trim().toLowerCase()===b.code.trim().toLowerCase())return true;const ta=skuToks(a.name),tb=skuToks(b.name);if(!ta.length||!tb.length)return false;
  const na=ta.filter(x=>/\d/.test(x)).sort().join(),nb=tb.filter(x=>/\d/.test(x)).sort().join();if(na!==nb)return false;
  const wa=new Set(ta.filter(x=>!/\d/.test(x))),wb=new Set(tb.filter(x=>!/\d/.test(x)));const i=[...wa].filter(x=>wb.has(x)).length,u=new Set([...wa,...wb]).size;
  if(u&&i/u>=.75)return true;const ja=[...ta].sort().join(''),jb=[...tb].sort().join('');return Math.min(ja.length,jb.length)>=8&&lev(ja,jb)<=Math.max(2,Math.floor(Math.max(ja.length,jb.length)*.12));}
function skuStats(){const m=new Map();for(const r of D.rows){const k=r.sc+'|'+r.sn;let e=m.get(k);if(!e)m.set(k,e={code:r.sc,name:r.sn,rows:0,om:0,last:''});e.rows++;e.om+=r.om;if((r.om!==0||r.q!==0)&&r.d>e.last)e.last=r.d;}return[...m.values()].sort((a,b)=>b.om-a.om);}
function vSku(){const st=skuStats();const gr=groupBy(st,skuSim,(a,b)=>b.last.localeCompare(a.last)||b.om-a.om);
  $('main').innerHTML=`<div class="card"><b>Kemungkinan SKU ganda (${gr.length})</b><div class="mut">Saran SKU utama = yang paling baru terjual. Penggabungan mengubah riwayat penjualan & stok di cloud dan tidak bisa dipisah lagi.</div>
  ${gr.map((g,gi)=>`<div class="grp">${g.map((n,i)=>`<label><input type="radio" name="k${gi}" value="${i}" ${i===0?'checked':''}> <b>${esc(n.name)}</b> ${i===0?'<span class="tag">SARAN</span>':''} <span class="mut">${n.code?'kode '+esc(n.code):'tanpa kode'} - ${nf.format(n.rows)} baris - Rp ${nf.format(n.om)} - terakhir ${n.last||'-'}</span></label>`).join('')}<button onclick="mergeSku(${gi})">Satukan</button></div>`).join('')||'<div class="mut">Tidak ada SKU mirip.</div>'}</div>`;X.kg=gr;}
async function mergeSku(gi){const g=X.kg[gi];const sel=+document.querySelector(`input[name=k${gi}]:checked`).value;const to=g[sel],froms=g.filter((_,i)=>i!==sel);
  if(!confirm('Satukan '+froms.map(f=>f.name).join(', ')+' menjadi '+to.name+'? Tidak bisa dipisah lagi.'))return;
  try{await api('POST','/sync/rename',{profile,kind:'sku',items:froms.map(f=>({fc:f.code,fn:f.name,tc:to.code,tn:to.name}))});
    if(D.stock.length){const ids=new Set(froms.map(f=>f.code+'|'+f.name.toLowerCase()));const tid=to.code+'|'+to.name.toLowerCase();let sum=0,moved=0,has=false;const keep=[];
      for(const s of D.stock){const id=(s.c||'')+'|'+(s.n||'').toLowerCase();if(ids.has(id)){sum+=+s.q;moved++}else if(id===tid){sum+=+s.q;has=true;keep.push(s)}else keep.push(s)}
      if(moved){const out=has?keep.map(s=>((s.c||'')+'|'+(s.n||'').toLowerCase())===tid?{...s,q:sum}:s):[...keep,{c:to.code,n:to.name,q:sum}];await api('POST','/sync/stock',{profile,items:out});}}
    alert('Selesai.');await loadData();}catch(e){alert('Gagal: '+e.message+' (pastikan Worker jdata-sync sudah di-deploy versi terbaru)')}}
init();
</script></body></html>
