name = "jdata-sync"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Worker -> Worker lewat service binding (fetch ke workers.dev antar-Worker satu akun ditolak 404)
[[services]]
binding = "AUTH"
service = "jdata-report-auth"

[[d1_databases]]
binding = "DB"
database_name = "jdata_sync_db"
# database_id diisi otomatis bila deploy via "Import repository"; manual: isi dari `wrangler d1 create jdata_sync_db`
