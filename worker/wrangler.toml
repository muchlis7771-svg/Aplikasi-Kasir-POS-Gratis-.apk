# Deploy (jalankan di folder ini, butuh Node 20+):
#   npx wrangler d1 create jpos                      -> salin database_id ke bawah
#   npx wrangler d1 execute jpos --remote --file=schema.sql
#   npx wrangler secret put SECRET                   (string acak panjang, penanda token)
#   npx wrangler secret put ADMIN_USER               (username Head Admin)
#   npx wrangler secret put ADMIN_PASS               (password Head Admin)
#   npx wrangler deploy
# Hasil: https://jpos-api.<subdomain-anda>.workers.dev  (aplikasi web + API satu alamat)
name = "jpos-api"
main = "worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "jpos"
database_id = "ISI_DATABASE_ID"
