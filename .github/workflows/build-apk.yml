name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, jpos]
    paths-ignore: ['worker/**', '*.md']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Atur alamat server API (opsional)
        run: |
          if [ -n "${{ vars.API_URL }}" ]; then echo "window.JPOS_API = '${{ vars.API_URL }}';" > public/config.js; fi
          cat public/config.js
      - run: npm install
      - run: pip install pillow
      - run: npx cap add android
      - run: node scripts/patch-android.js && python3 scripts/make-icons.py
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Ganti nama
        run: cp android/app/build/outputs/apk/debug/app-debug.apk J-POS.apk
      - uses: actions/upload-artifact@v4
        with: { name: J-POS-apk, path: J-POS.apk }
      - name: Rilis (agar mudah diunduh dari HP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: J-POS APK (terbaru)
          files: J-POS.apk
