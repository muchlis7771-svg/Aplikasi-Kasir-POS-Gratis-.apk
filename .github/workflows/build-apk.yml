name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, jpos]
    paths-ignore: ['worker/**', '*.md']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Cek Android SDK (sudah terpasang di runner)
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME
      - name: Atur alamat server API (opsional)
        run: |
          if [ -n "${{ vars.API_URL }}" ]; then echo "window.JPOS_API = '${{ vars.API_URL }}';" > public/config.js; fi
          cat public/config.js
      - run: npm install
      - run: pip install pillow
      - run: npx cap add android
      - run: node scripts/patch-android.js && python3 scripts/make-icons.py
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Ganti nama
        run: cp android/app/build/outputs/apk/debug/app-debug.apk J-POS.apk
      - name: Build APK rilis (belum ditandatangani; ditandatangani kunci resmi J-POS di luar repo)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release-unsigned.apk ../J-POS-unsigned.apk
      - name: Build AAB rilis untuk Play Store (belum ditandatangani; ditandatangani dengan kunci pemilik di luar repo)
        run: node scripts/patch-play.js && cd android && ./gradlew bundleRelease --no-daemon && cp app/build/outputs/bundle/release/app-release.aab ../J-POS-unsigned.aab
      - name: Rilis AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aab-latest
          name: J-POS AAB Play Store (belum ditandatangani)
          files: |
            J-POS-unsigned.aab
            J-POS-unsigned.apk
      - uses: actions/upload-artifact@v4
        with: { name: J-POS-apk, path: J-POS.apk }
      - name: Rilis (agar mudah diunduh dari HP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: J-POS APK (terbaru)
          files: J-POS.apk
