name: Build Desktop (Windows & Linux)
on:
  workflow_dispatch:
  push:
    branches: [jpos]
    paths: ['public/**', 'desktop/**', '.github/workflows/build-desktop.yml']
permissions:
  contents: write
jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Salin aplikasi web ke paket desktop
        shell: bash
        run: |
          rm -rf desktop/app && cp -r public desktop/app
          if [ -n "${{ vars.API_URL }}" ]; then echo "window.JPOS_API = '${{ vars.API_URL }}';" > desktop/app/config.js; fi
      - name: Pasang & build
        working-directory: desktop
        shell: bash
        run: npm install && npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: J-POS Desktop (laptop) terbaru
          files: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
